name: Validate → Split → Build Hugo → Deploy Pages (no tracked content)

on:
  repository_dispatch:
    types: [drive_push]   # triggered by your Apps Script
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Recreate a temp source/ file from the repository_dispatch payload
      - name: Materialize uploaded .md into ./source
        run: |
          mkdir -p source
          python - <<'PY'
          import os, json, base64, sys
          from pathlib import Path

          ev_path = os.environ.get("GITHUB_EVENT_PATH")
          if not ev_path or not os.path.exists(ev_path):
            print("GITHUB_EVENT_PATH not found", file=sys.stderr); sys.exit(1)

          with open(ev_path, "r", encoding="utf-8") as f:
            ev = json.load(f)

          cp = ev.get("client_payload") or {}
          filename = cp.get("filename", "uploaded.md")
          b64 = cp.get("content_b64")
          if not b64:
            print("No content_b64 in client_payload", file=sys.stderr); sys.exit(1)

          try:
            data = base64.b64decode(b64).decode("utf-8")
          except Exception as e:
            print(f"Base64 decode error: {e}", file=sys.stderr); sys.exit(1)

          Path("source").mkdir(parents=True, exist_ok=True)
          out_path = Path("source") / filename
          out_path.write_text(data, encoding="utf-8")
          print(f"Wrote {out_path}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate source (workspace only)
        run: python tools/validate_source.py

      - name: Split to Hugo content (workspace only)
        run: python tools/splitter.py

      - name: Validate generated front matter
        run: python tools/validate_frontmatter.py

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.128.0'
          extended: true

      - name: Build Hugo
        working-directory: ./german-revision-helper
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./german-revision-helper/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
