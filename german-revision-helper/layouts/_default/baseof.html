<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --w: 900px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    body { margin: 0; font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; color:#111; }
    header, main, footer { max-width: var(--w); margin: 0 auto; padding: 1.25rem; }
    header { border-bottom: 1px solid #eee; }
    footer { border-top: 1px solid #eee; color:#555; font-size: 0.9rem;}
    pre, code { font-family: var(--mono); background: #f6f8fa; }
    pre { padding: 0.75rem; overflow: auto; }
    .meta { color:#666; font-size:0.9rem; margin: 0.25rem 0 1rem; }
    a { color:#0a58ca; text-decoration:none; } a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0">{{ .Site.Title }}</h1>
    <div class="meta"><a href="{{ "/" | relURL }}">Home</a></div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <div>Built with Hugo. Auto-generated from daily notes.</div>
  </footer>
</body>
</html>
